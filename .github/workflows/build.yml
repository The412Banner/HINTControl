name: Build

on:
  push:
    branches: ["feat/**", "fix/**"]
    paths-ignore: ["PROGRESS_LOG.md", "README.md", "release-notes/**", "docs/**"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub release with the APK"
        type: boolean
        default: false
      tag:
        description: "Release tag, e.g. v1.0.0-pre1 (release-notes/<tag>.md must exist)"
        type: string
        default: ""
      prerelease:
        description: "Mark the release as a pre-release"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test, build, sign
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Gateway unit tests
        run: ./gradlew --no-daemon :gateway:test

      - name: App unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest --tests 'com.banner.hintcontrol.LogicTest' --tests 'com.banner.hintcontrol.ContainerTest'

      - name: Build APK
        run: ./gradlew --no-daemon :app:assembleRelease --stacktrace

      - name: Sign (v1 + v2 + v3, AOSP test key) and verify
        run: |
          set -e
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          IN=app/build/outputs/apk/release/app-release.apk
          APK=app/build/outputs/apk/release/app-release-signed.apk
          "$BT/apksigner" sign --ks keystore/testkey.p12 --ks-pass pass:android --ks-key-alias testkey --key-pass pass:android \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --min-sdk-version 23 \
            --out "$APK" "$IN"
          "$BT/apksigner" verify --verbose --print-certs --min-sdk-version 23 "$APK" | tee verify.txt
          grep -q "Verified using v1 scheme (JAR signing): true" verify.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" verify.txt
          grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" verify.txt
          grep -qi "SHA-256 digest: a40da80a59d170caa950cf15c18c454d47a39b26989d8b640ecd745ba71bf5dc" verify.txt
          "$BT/aapt2" dump badging "$APK" | grep -E "^package:|^application-label:|^sdkVersion|^targetSdkVersion"

      - name: Name APK
        id: apk
        run: |
          set -e
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          SHA=${GITHUB_SHA::8}
          NAME="HINTControl-v${VER}-${SHA}.apk"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release-signed.apk "dist/$NAME"
          (cd dist && sha256sum "$NAME" > "$NAME.sha256" && cat "$NAME.sha256")
          ls -la dist
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: HINTControl-apk
          path: dist/
          retention-days: 30

      - name: Screenshots (demo data)
        continue-on-error: true
        run: ./gradlew --no-daemon :app:testDebugUnitTest --tests 'com.banner.hintcontrol.ScreenshotTest'

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            app/build/screenshots/
            app/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish release
        if: inputs.release && inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          NOTES="release-notes/${{ inputs.tag }}.md"
          test -f "$NOTES"
          FLAGS=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then FLAGS="--prerelease"; fi
          gh release create "${{ inputs.tag }}" dist/* \
            --target "$GITHUB_SHA" \
            --title "Banners HINT Control ${{ inputs.tag }}" \
            --notes-file "$NOTES" $FLAGS
